services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: familyconnect
      POSTGRES_PASSWORD: familypassword
      POSTGRES_DB: familyconnect_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familyconnect -d familyconnect_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mock-aadhaar:
    build:
      context: ./mock-aadhaar
    ports:
      - "8001:8000"
    volumes:
      - ./mock-aadhaar:/app
    environment:
      - SERVICE_NAME=Mock Aadhaar Identity Service
      - DATA_PATH=/app/data/citizens.json

  mock-ration:
    build:
      context: ./mock-ration
    ports:
      - "8002:8000"
    volumes:
      - ./mock-ration:/app
    environment:
      - SERVICE_NAME=Mock Ration Household Service
      - DATA_PATH=/app/data/households.json

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://familyconnect:familypassword@db:5432/familyconnect_db
      - JWT_SECRET_KEY=supersecretkey12345
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - AADHAAR_SERVICE_URL=http://mock-aadhaar:8000
      - RATION_SERVICE_URL=http://mock-ration:8000
    depends_on:
      db:
        condition: service_healthy
      mock-aadhaar:
        condition: service_started
      mock-ration:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
